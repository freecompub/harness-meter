[project]
name = "harness-meter"
version = "0.1.0"
description = "Measure and compare token consumption across AI coding agent harnesses"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["mitmproxy>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/freecompub/harness-meter"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# sys.path manipulation must precede local imports in standalone entry points.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
"token_meter.py" = ["E402"]
